{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uione.serviceAccountName" . }}
  labels:
    {{- include "uione.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application calls no Kubernetes API. Mounting a token would hand every
# prompt-injection attempt a cluster credential to aim at.
automountServiceAccountToken: false
{{- end }}
