apiVersion: v1
kind: Service
metadata:
  name: {{ include "uione.fullname" . }}
  labels:
    {{- include "uione.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "uione.selectorLabels" . | nindent 4 }}
    # Web pods only. The scheduler serves the same HTTP surface but must never
    # receive user traffic: it is sized for background work and taking requests
    # would make people wait behind brief generation.
    app.kubernetes.io/component: web
