# Alembic configuration.
#
# The script location is inside the package rather than at the repo root, so
# migrations ship with the installed product. An operator upgrading an
# air-gapped install has the image they were given and nothing else — if the
# migrations live only in the source tree, they cannot run them.
[alembic]
script_location = %(here)s/src/uione/storage/migrations
prepend_sys_path = %(here)s/src

# Filenames sort chronologically, so `ls` shows the order they ran in.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# The URL is read from UIONE_DATABASE_URL by env.py rather than set here: the
# same image runs against SQLite on a laptop and Postgres in a datacentre, and a
# connection string in a checked-in file is a connection string in a git history.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
