[project]
name = "uione"
version = "0.1.0"
description = "UiOne AI — on-premise, open-weight, MCP-native enterprise assistant platform"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "sse-starlette>=2.1",
    "jsonschema>=4.23",
    "sqlalchemy[asyncio]>=2.0",
    # Migrations. A runtime dependency rather than a dev one: an air-gapped
    # operator upgrades the product with the image they were given, and a
    # migration tool that is not in it is a migration they cannot run.
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pyjwt[crypto]>=2.9",
    "icalendar>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # The official SDK is a *test* dependency: it provides the real MCP server
    # our own client is validated against. Nothing in src/ imports it — a client
    # that ships with the product should be one the product owns, and an
    # air-gapped install should not carry a dependency it never calls.
    "mcp>=1.2",
    # A real CalDAV server, for the same reason as `mcp` above: writing
    # iCalendar is unforgiving and a fixture that accepts our output proves
    # only that we agree with ourselves. Pure Python, so CI runs it.
    "radicale>=3.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "respx>=0.21",
]
postgres = [
    "asyncpg>=0.30",
]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uione"]

[tool.hatch.build.targets.wheel.force-include]
"src/uione/web/static" = "uione/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:uione.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these. Hand-wrapping them would be undone by the next
# autogenerate, and a migration is read for what it does, not its margins.
"src/uione/storage/migrations/versions/*.py" = ["E501"]
